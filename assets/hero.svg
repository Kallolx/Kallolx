<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Kamrul Hasan Kallol — Full-Stack Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="1" stop-color="#121a2b"/>
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".40"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset=".6" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

    .grid  { animation: drift 8s linear infinite; }
    .orbA  { animation: floatA 14s ease-in-out infinite; }
    .orbB  { animation: floatB 18s ease-in-out infinite; }

    .intro { opacity: 0; animation: rise .9s ease-out .1s forwards; }
    .name  { opacity: 0; animation: rise .9s ease-out .35s forwards; }
    .meta  { opacity: 0; animation: rise .9s ease-out .6s forwards; }

    .role  { opacity: 0; animation: cycle 12s ease-in-out infinite; }
    .r2    { animation-delay: 4s; }
    .r3    { animation-delay: 8s; }

    .cursor { animation: blink 1s steps(1) infinite; }
    .pulse  { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }

    .spin   { transform-origin: 975px 170px; animation: spin 40s linear infinite; }
    .spinR  { transform-origin: 975px 170px; animation: spin 26s linear infinite reverse; }
    .node   { animation: twinkle 3s ease-in-out infinite; }
    .n2 { animation-delay: .8s; } .n3 { animation-delay: 1.6s; } .n4 { animation-delay: 2.2s; }

    @keyframes drift  { from { transform: translate(0,0); } to { transform: translate(40px,40px); } }
    @keyframes floatA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,30px); } }
    @keyframes floatB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px,-25px); } }
    @keyframes rise   { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes cycle  {
      0%      { opacity: 0; transform: translateY(10px); }
      5%, 28% { opacity: 1; transform: translateY(0); }
      33%,100%{ opacity: 0; transform: translateY(-10px); }
    }
    @keyframes blink  { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    @keyframes pulse  { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3.2); opacity: 0; } }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes twinkle{ 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect class="grid" x="-40" y="-40" width="1280" height="420" fill="url(#grid)"/>
    <circle class="orbA" cx="230" cy="60"  r="260" fill="url(#glowCyan)"/>
    <circle class="orbB" cx="980" cy="290" r="280" fill="url(#glowViolet)"/>

    <!-- Right: orbital "system" motif -->
    <g opacity=".9">
      <circle cx="975" cy="170" r="118" fill="none" stroke="#67e8f9" stroke-opacity=".18"/>
      <g class="spin">
        <circle cx="975" cy="170" r="118" fill="none" stroke="#67e8f9" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 14"/>
        <circle class="node"    cx="1093" cy="170" r="5" fill="#67e8f9"/>
        <circle class="node n3" cx="857"  cy="170" r="4" fill="#a78bfa"/>
      </g>
      <circle cx="975" cy="170" r="76" fill="none" stroke="#a78bfa" stroke-opacity=".2"/>
      <g class="spinR">
        <circle cx="975" cy="170" r="76" fill="none" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="30 18"/>
        <circle class="node n2" cx="975" cy="94"  r="4.5" fill="#c4b5fd"/>
        <circle class="node n4" cx="975" cy="246" r="3.5" fill="#67e8f9"/>
      </g>
      <rect x="943" y="138" width="64" height="64" rx="16" fill="#0f172a" stroke="#67e8f9" stroke-opacity=".5"/>
      <text x="975" y="179" text-anchor="middle" class="mono" font-size="24" font-weight="700" fill="#67e8f9">&lt;/&gt;</text>
    </g>

    <!-- Left: identity -->
    <g class="intro">
      <text x="80" y="104" class="mono" font-size="17" fill="#64748b">~/kallolx <tspan fill="#67e8f9">$</tspan> <tspan fill="#cbd5e1">whoami</tspan><tspan class="cursor" fill="#67e8f9"> ▍</tspan></text>
    </g>

    <g class="name">
      <text x="78" y="172" class="sans" font-size="62" font-weight="800" letter-spacing="-1.5" fill="url(#nameGrad)">Kamrul Hasan Kallol</text>
    </g>

    <g class="mono" font-size="22">
      <text class="role"    x="80" y="218" fill="#67e8f9">› Full-Stack Software Engineer</text>
      <text class="role r2" x="80" y="218" fill="#c4b5fd">› Lead Developer @ Wonderscore.ai</text>
      <text class="role r3" x="80" y="218" fill="#67e8f9">› Building Softune — commerce SaaS</text>
    </g>

    <g class="meta">
      <circle class="pulse" cx="88" cy="270" r="5" fill="#34d399"/>
      <circle cx="88" cy="270" r="5" fill="#34d399"/>
      <text x="104" y="276" class="sans" font-size="16" fill="#94a3b8">Dhaka, Bangladesh  ·  open to collaborations &amp; freelance</text>
    </g>

    <rect x=".5" y=".5" width="1199" height="339" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
